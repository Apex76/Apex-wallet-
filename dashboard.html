<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.header{
    background:#1f4ed8;
    color:white;
    padding:30px 20px;
    text-align:center;
}

.profile-pic{
    width:90px;
    height:90px;
    border-radius:50%;
    border:4px solid white;
    object-fit:cover;
    background:white;
}

.name{
    margin-top:10px;
    font-size:22px;
    font-weight:bold;
}

.card{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.balance-title{
    color:#666;
    font-size:18px;
}

.balance{
    font-size:40px;
    font-weight:bold;
    color:#1f4ed8;
    margin:10px 0 20px;
}

.btn{
    display:block;
    background:#1f4ed8;
    color:white;
    text-align:center;
    padding:15px;
    text-decoration:none;
    border-radius:10px;
    margin-top:15px;
    font-size:18px;
}

.btn:hover{
    background:#153ba7;
}
</style>

</head>

<body>

<script>
if(!localStorage.getItem("loggedIn")){
    window.location.href="index.html";
}
</script>

<div class="header">

<img id="profilePic"
src="https://i.imgur.com/4Z7bKQp.png"
class="profile-pic">

<div class="name" id="welcomeName">
Welcome 👋
</div>

<h2>APEX BANK</h2>

<p>Account Dashboard</p>

</div>

<div class="card">

<div class="balance-title">
Available Balance
</div>

<div class="balance">
$0.00
</div>

<a href="transfer.html" class="btn">
Transfer Money
</a>

<a href="history.html" class="btn">
Transaction History
</a>

<a href="settings.html" class="btn">
Settings
</a>

</div>

<script>
// Show user's name
const fullname = localStorage.getItem("fullname");

if(fullname){
    document.getElementById("welcomeName").innerHTML =
    "Welcome, " + fullname + " 👋";
}

// Show saved profile picture
const savedImage = localStorage.getItem("profileImage");

if(savedImage){
    document.getElementById("profilePic").src = savedImage;
}
</script>

</body>
</html>
