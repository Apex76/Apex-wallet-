<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Apex Bank</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

.header{
background:#1f4ed8;
color:white;
padding:20px;
text-align:center;
}

.card{
background:white;
margin:20px;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.profilePic{
width:140px;
height:140px;
border-radius:50%;
object-fit:cover;
border:4px solid #1f4ed8;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:15px 0;
}

button{
width:100%;
padding:15px;
background:#1f4ed8;
color:white;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
}

#message{
margin-top:15px;
font-weight:bold;
}

.back{
display:block;
margin-top:15px;
text-decoration:none;
color:#1f4ed8;
}
</style>
</head>

<body>

<div class="header">
<h2>My Profile</h2>
</div>

<div class="card">

<img
id="profilePreview"
class="profilePic"
src=""
alt="Profile Picture"
>

<h3>Change Profile Picture</h3>

<input
type="file"
id="photoInput"
accept="image/*"
>

<button id="saveBtn">
Save Profile Picture
</button>

<div id="message"></div>

<a href="dashboard2.html" class="back">
Back to Dashboard
</a>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
apiKey: "AIzaSyDqpSzFzHDS-zI1gR6oP-wXWqKBfXgcX4w",
authDomain: "apex-wallet-2.firebaseapp.com",
projectId: "apex-wallet-2",
storageBucket: "apex-wallet-2.firebasestorage.app",
messagingSenderId: "660772557652",
appId: "1:660772557652:web:b9535515388134f8802ec1",
measurementId: "G-KEJP4GN5VV"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const photoInput = document.getElementById("photoInput");
const saveBtn = document.getElementById("saveBtn");
const preview = document.getElementById("profilePreview");
const message = document.getElementById("message");

let currentUser = null;
let selectedImage = null;


// Check logged-in user
onAuthStateChanged(auth, async (user) => {

if(!user){

window.location.href = "index.html";

return;

}

currentUser = user;


// Load existing picture
try{

const userRef = doc(db, "users", user.uid);

const userSnap = await getDoc(userRef);

if(userSnap.exists()){

const data = userSnap.data();

if(data.profileImage){

preview.src = data.profileImage;

}

}

}catch(error){

console.error(error);

}

});


// Select picture
photoInput.addEventListener("change", (event) => {

const file = event.target.files[0];

if(!file){
return;
}


// Make sure it is an image
if(!file.type.startsWith("image/")){

message.textContent = "Please choose an image.";

return;

}


// Compress image before saving
const reader = new FileReader();

reader.onload = (e) => {

const image = new Image();

image.onload = () => {

const canvas = document.createElement("canvas");

const maxSize = 400;

let width = image.width;
let height = image.height;


if(width > height){

if(width > maxSize){

height = height * (maxSize / width);

width = maxSize;

}

}else{

if(height > maxSize){

width = width * (maxSize / height);

height = maxSize;

}

}


canvas.width = width;
canvas.height = height;


const ctx = canvas.getContext("2d");

ctx.drawImage(image, 0, 0, width, height);


// Compressed image
selectedImage = canvas.toDataURL("image/jpeg", 0.75);

preview.src = selectedImage;

message.textContent = "Picture selected. Tap Save.";

};

image.src = e.target.result;

};

reader.readAsDataURL(file);

});


// Save picture
saveBtn.addEventListener("click", async () => {

if(!currentUser){

message.textContent = "Please login first.";

return;

}

if(!selectedImage){

message.textContent = "Choose a picture first.";

return;

}


saveBtn.disabled = true;

saveBtn.textContent = "Saving...";


try{

const userRef = doc(db, "users", currentUser.uid);

await updateDoc(userRef, {

profileImage: selectedImage

});


// Also update the old localStorage value
// so existing dashboard code keeps working
localStorage.setItem("profileImage", selectedImage);

message.textContent = "Profile picture saved successfully!";


}catch(error){

console.error(error);

message.textContent = "Could not save picture: " + error.message;

}


saveBtn.disabled = false;

saveBtn.textContent = "Save Profile Picture";

});

</script>

</body>
</html>
