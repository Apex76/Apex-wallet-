<title>Transfer Money</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.header{
    background:#1f4ed8;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    background:white;
    width:90%;
    max-width:500px;
    margin:20px auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

label{
    display:block;
    margin-top:14px;
    font-weight:bold;
    color:#333;
}

input, select{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
    font-size:16px;
    background:white;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    background:#1f4ed8;
    color:white;
    border:none;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#153ba7;
}

.conversion{
    margin-top:15px;
    padding:15px;
    background:#eef4ff;
    border-radius:10px;
    text-align:center;
}

.rate{
    color:#555;
    font-size:14px;
}

.receive{
    margin-top:8px;
    font-size:21px;
    font-weight:bold;
    color:#1f4ed8;
}

.note{
    margin-top:8px;
    font-size:12px;
    color:#777;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#1f4ed8;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

    bank.innerHTML =
        '<option value="">-- Select Bank --</option>';

    if(!countryCode){
        updateConversion();
        return;
    }

    const data = countries[countryCode];

    /* Add currency */

    const option = document.createElement("option");

    option.value = data.currency;

    option.textContent =
        data.symbol + " " +
        data.currency + " — " +
        data.name;

    option.selected = true;

    currency.appendChild(option);


    /* Add banks */

    data.banks.forEach(function(bankName){

        const bankOption =
            document.createElement("option");

        bankOption.value = bankName;

        bankOption.textContent = bankName;

        bank.appendChild(bankOption);

    });

    updateConversion();
}


/* ========================================
   CONVERSION
======================================== */

function updateConversion(){

    const countryCode =
        document.getElementById("country").value;

    const amount =
        parseFloat(
            document.getElementById("amount").value
        );

    const rateText =
        document.getElementById("rateText");

    const receiveText =
        document.getElementById("receiveText");

    if(!countryCode){

        rateText.textContent =
            "Select a country and currency";

        receiveText.textContent =
            "Recipient receives: —";

        return;
    }

    const data = countries[countryCode];

    rateText.textContent =
        "Exchange rate: 1 USD = " +
        data.rate.toLocaleString() +
        " " +
        data.currency;

    if(isNaN(amount) || amount <= 0){

        receiveText.textContent =
            "Recipient receives: —";

        return;
    }

    const converted =
        amount * data.rate;

    receiveText.textContent =
        "Recipient receives: " +
        data.symbol +
        converted.toLocaleString(
            undefined,
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        ) +
        " " +
        data.currency;
}


/* ========================================
   CONTINUE
======================================== */

function continueTransfer(){

    const recipient =
        document.getElementById("recipient").value.trim();

    const account =
        document.getElementById("account").value.trim();

    const countryCode =
        document.getElementById("country").value;

    const currency =
        document.getElementById("currency").value;

    const bank =
        document.getElementById("bank").value;

    const amount =
        document.getElementById("amount").value;

    if(
        !recipient ||
        !account ||
        !countryCode ||
        !currency ||
        !bank ||
        !amount
    ){

        alert("Please complete all transfer details.");

        return;
    }

    const data = countries[countryCode];

    const converted =
        parseFloat(amount) * data.rate;


    localStorage.setItem(
        "recipient",
        recipient
    );

    localStorage.setItem(
        "account",
        account
    );

    localStorage.setItem(
        "bank",
        bank
    );

    localStorage.setItem(
        "country",
        document.getElementById("country")
        .selectedOptions[0].text
    );

    localStorage.setItem(
        "currency",
        data.currency
    );

    localStorage.setItem(
        "currencyName",
        data.name
    );

    localStorage.setItem(
        "currencySymbol",
        data.symbol
    );

    localStorage.setItem(
        "exchangeRate",
        data.rate
    );

    localStorage.setItem(
        "amount",
        amount
    );

    localStorage.setItem(
        "localAmount",
        converted
    );


    window.location.href =
        "confirm.html";
}

</script>
