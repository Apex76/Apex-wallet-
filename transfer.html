<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transfer Money</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
}

.header{
background:#1f4ed8;
color:white;
padding:20px;
text-align:center;
}

.container{
background:white;
width:90%;
max-width:500px;
margin:20px auto;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

input{
width:100%;
padding:14px;
margin-top:12px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#1f4ed8;
color:white;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#153ba7;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#1f4ed8;
text-decoration:none;
font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
<h2>Transfer Money</h2>
</div>

<div class="container">

<input type="text" id="recipient" placeholder="Recipient Name" required>

<input type="text" id="account" placeholder="Account Number" required>

<input type="text" id="bank" placeholder="Bank Name" required>

<input type="text" id="country" placeholder="Country" required>

<input type="number" id="amount" placeholder="Amount (USD)" required>

<button onclick="continueTransfer()">
Continue
</button>

<a href="dashboard.html" class="back">
← Back to Dashboard
</a>

</div>

<script>

function continueTransfer(){

localStorage.setItem("recipient",
document.getElementById("recipient").value);

localStorage.setItem("account",
document.getElementById("account").value);

localStorage.setItem("bank",
document.getElementById("bank").value);

localStorage.setItem("country",
document.getElementById("country").value);

localStorage.setItem("amount",
document.getElementById("amount").value);

window.location.href="confirm.html";

}

</script>

</body>
</html>
