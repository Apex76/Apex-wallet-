<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

.header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:20px;
max-width:500px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.balance{
font-size:32px;
font-weight:bold;
color:#0056d6;
margin:15px 0 25px;
}

input{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#0056d6;
color:white;
border:none;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#003fa5;
}
</style>

</head>

<body>

<div class="header">
ADMIN DASHBOARD
</div>

<div class="container">

<div class="card">

<h3>Admin Balance</h3>

<div class="balance">
$999,999,999
</div>

<input type="email" id="userEmail" placeholder="User Email">

<input type="number" id="amount" placeholder="Amount (USD)">

<button id="transferBtn">
Transfer Money
</button>

</div>

</div>

</body>
</html>
