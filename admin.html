<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

.header{
background:#003366;
color:white;
padding:20px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:20px;
max-width:500px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.balance{
font-size:32px;
font-weight:bold;
color:#0056d6;
margin:15px 0 25px;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input,
select{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
background:white;
}

button{
width:100%;
padding:15px;
background:#0056d6;
color:white;
border:none;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#003fa5;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

#message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.receipt{
display:none;
margin-top:20px;
padding:20px;
border:1px solid #ddd;
border-radius:15px;
background:#fafafa;
}

.receipt h2{
text-align:center;
margin-bottom:15px;
color:#003366;
}

.receipt-row{
display:flex;
justify-content:space-between;
padding:9px 0;
border-bottom:1px solid #eee;
}

.receipt-row:last-child{
border-bottom:none;
}

.receipt-label{
font-weight:bold;
}

.receipt button{
margin-top:15px;
}
</style>
</head>

<body>

<div class="header">
ADMIN DASHBOARD
</div>

<div class="container">

<div class="card">

<h3>Admin Balance</h3>

<div class="balance">
$999,999,999
</div>

<label>Sender Name</label>
<input
type="text"
id="senderName"
placeholder="Enter sender name"
required
>

<label>User Email</label>
<input
type="email"
id="userEmail"
placeholder="Enter user's email"
required
>

<label>Amount</label>
<input
type="number"
id="amount"
placeholder="Amount (USD)"
min="0"
step="0.01"
required
>

<label>Action</label>
<select id="action">
<option value="credit">Credit User</option>
<option value="debit">Debit User</option>
</select>

<label>Transaction Status</label>
<select id="status">
<option value="Completed">Completed</option>
<option value="Pending">Pending</option>
<option value="Declined">Declined</option>
</select>

<button id="transferBtn">
Transfer Money
</button>

<div id="message"></div>

<div class="receipt" id="receipt">

<h2>APEX WALLET</h2>

<p style="text-align:center;margin-bottom:15px;">
TRANSACTION RECEIPT
</p>

<div class="receipt-row">
<span class="receipt-label">Transaction ID</span>
<span id="receiptId"></span>
</div>

<div class="receipt-row">
<span class="receipt-label">From</span>
<span id="receiptSender"></span>
</div>

<div class="receipt-row">
<span class="receipt-label">To</span>
<span id="receiptReceiver"></span>
</div>

<div class="receipt-row">
<span class="receipt-label">Amount</span>
<span id="receiptAmount"></span>
</div>

<div class="receipt-row">
<span class="receipt-label">Type</span>
<span id="receiptType"></span>
</div>

<div class="receipt-row">
<span class="receipt-label">Status</span>
<span id="receiptStatus"></span>
</div>

<div class="receipt-row">
<span class="receipt-label">Date</span>
<span id="receiptDate"></span>
</div>

<button onclick="window.print()">
Print Receipt
</button>

</div>

</div>

</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
doc,
updateDoc,
setDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyDqpSzFzHDS-zI1gR6oP-wXWqKBfXgcX4w",

authDomain: "apex-wallet-2.firebaseapp.com",

projectId: "apex-wallet-2",

storageBucket: "apex-wallet-2.firebasestorage.app",

messagingSenderId: "660772557652",

appId: "1:660772557652:web:b9535515388134f8802ec1",

measurementId: "G-KEJP4GN5VV"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


const transferBtn =
document.getElementById("transferBtn");

const message =
document.getElementById("message");

let currentAdmin = null;


/*
CHECK FIREBASE LOGIN
*/

onAuthStateChanged(auth, (user) => {

if(user){

currentAdmin = user;

message.textContent =
"Admin authenticated.";

message.style.color =
"green";

}else{

currentAdmin = null;

message.textContent =
"Please sign in before making a transfer.";

message.style.color =
"red";

}

});


/*
TRANSFER
*/

transferBtn.addEventListener("click", async () => {

message.textContent = "";

document.getElementById("receipt").style.display =
"none";


/*
MAKE SURE ADMIN IS LOGGED IN
*/

if(!currentAdmin){

message.textContent =
"Transfer failed: Admin is not signed in.";

message.style.color =
"red";

return;

}


const senderName =
document.getElementById("senderName").value.trim();

const email =
document.getElementById("userEmail").value.trim();

const amount =
Number(document.getElementById("amount").value);

const action =
document.getElementById("action").value;

const status =
document.getElementById("status").value;


if(!senderName){

message.textContent =
"Enter the sender name.";

return;

}


if(!email){

message.textContent =
"Enter the user's email.";

return;

}


if(!amount || amount <= 0){

message.textContent =
"Enter a valid amount.";

return;

}


transferBtn.disabled =
true;

transferBtn.textContent =
"Processing...";


try{

/*
FIND USER
*/

const usersRef =
collection(db,"users");

const userQuery =
query(
usersRef,
where("email","==",email)
);

const snapshot =
await getDocs(userQuery);


if(snapshot.empty){

message.textContent =
"User not found.";

return;

}


const userDoc =
snapshot.docs[0];

const userData =
userDoc.data();

const currentBalance =
Number(userData.balance || 0);

let newBalance =
currentBalance;


/*
ONLY COMPLETED TRANSACTIONS
CHANGE THE USER BALANCE
*/

if(status === "Completed"){

if(action === "credit"){

newBalance =
currentBalance + amount;

}else{

if(amount > currentBalance){

message.textContent =
"User does not have enough balance.";

return;

}

newBalance =
currentBalance - amount;

}

await updateDoc(
doc(db,"users",userDoc.id),
{
balance:newBalance
}
);

}


/*
CREATE TRANSACTION ID
*/

const transactionRef =
doc(collection(db,"transactions"));

const transactionId =
transactionRef.id;

const date =
new Date().toISOString();


/*
USER TRANSACTION
*/

await setDoc(
transactionRef,
{

transactionId:transactionId,

userId:userDoc.id,

userEmail:email,

senderId:currentAdmin.uid,

senderEmail:
currentAdmin.email || "",

senderName:senderName,

receiverName:
userData.fullName || userData.name || email,

amount:amount,

type:
action === "credit"
? "Money Received"
: "Money Sent",

status:status,

date:date

}
);


/*
ADMIN/SENDER TRANSACTION
*/

const adminHistoryRef =
doc(collection(db,"transactions"));

await setDoc(
adminHistoryRef,
{

transactionId:transactionId,

userId:"admin",

adminId:currentAdmin.uid,

userEmail:email,

senderId:currentAdmin.uid,

senderEmail:
currentAdmin.email || "",

senderName:senderName,

receiverName:
userData.fullName || userData.name || email,

amount:amount,

type:
action === "credit"
? "Money Sent"
: "Money Received",

status:status,

date:date

}
);


/*
SUCCESS MESSAGE
*/

if(status === "Completed"){

message.textContent =
`Transfer successful. User balance is now $${newBalance.toLocaleString(
"en-US",
{
minimumFractionDigits:2
}
)}`;

message.style.color =
"green";

}else if(status === "Pending"){

message.textContent =
"Transaction created as Pending.";

message.style.color =
"orange";

}else{

message.textContent =
"Transaction created as Declined.";

message.style.color =
"red";

}


/*
SHOW RECEIPT
*/

document.getElementById("receiptId").textContent =
transactionId;

document.getElementById("receiptSender").textContent =
senderName;

document.getElementById("receiptReceiver").textContent =
userData.fullName || userData.name || email;

document.getElementById("receiptAmount").textContent =
"$" + amount.toLocaleString(
"en-US",
{
minimumFractionDigits:2
}
);

document.getElementById("receiptType").textContent =
action === "credit"
? "Money Sent"
: "Money Received";

document.getElementById("receiptStatus").textContent =
status;

document.getElementById("receiptDate").textContent =
new Date(date).toLocaleString();


document.getElementById("receipt").style.display =
"block";


/*
CLEAR FORM
*/

document.getElementById("amount").value =
"";

document.getElementById("senderName").value =
"";


}catch(error){

console.error(error);

message.textContent =
"Transfer failed: " + error.message;

message.style.color =
"red";

}finally{

transferBtn.disabled =
false;

transferBtn.textContent =
"Transfer Money";

}

});

</script>

</body>
</html>
