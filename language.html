<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Language</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.header{
    background:#1f4ed8;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:500px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

button{
    width:100%;
    padding:15px;
    margin:10px 0;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#1f4ed8;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#153ba7;
}

a{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#1f4ed8;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="header">
<h2>Select Language</h2>
</div>

<div class="container">

<button onclick="saveLanguage('English')">🇺🇸 English</button>

<button onclick="saveLanguage('Español')">🇪🇸 Español</button>

<button onclick="saveLanguage('Português')">🇵🇹 Português</button>

<button onclick="saveLanguage('Français')">🇫🇷 Français</button>

<button onclick="saveLanguage('Deutsch')">🇩🇪 Deutsch</button>

<button onclick="saveLanguage('Italiano')">🇮🇹 Italiano</button>

<a href="settings.html">← Back to Settings</a>

</div>

<script>
function saveLanguage(language){
    localStorage.setItem("language", language);
    alert("Language changed to " + language);
    window.location.href="settings.html";
}
</script>

</body>
</html>
