<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.header{
    background:#1f4ed8;
    color:white;
    text-align:center;
    padding:20px;
}

.card{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.transaction{
    padding:15px 0;
    border-bottom:1px solid #ddd;
}

.title{
    font-weight:bold;
    font-size:18px;
}

.info{
    margin-top:7px;
    color:#555;
    font-size:14px;
}

.date{
    color:#777;
    font-size:14px;
    margin-top:7px;
}

.amount{
    font-weight:bold;
    margin-top:7px;
    font-size:18px;
}

.completed{
    color:green;
}

.pending{
    color:#d98b00;
}

.declined{
    color:red;
}

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

.btn{
    display:block;
    text-align:center;
    background:#1f4ed8;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="header">
<h2>Transaction History</h2>
</div>

<div class="card">

<div id="history">
<div class="empty">
Loading transactions...
</div>
</div>

<a href="dashboard.html" class="btn">
Back to Dashboard
</a>

</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyDqpSzFzHDS-zI1gR6oP-wXWqKBfXgcX4w",

authDomain: "apex-wallet-2.firebaseapp.com",

projectId: "apex-wallet-2",

storageBucket: "apex-wallet-2.firebasestorage.app",

messagingSenderId: "660772557652",

appId: "1:660772557652:web:b9535515388134f8802ec1",

measurementId: "G-KEJP4GN5VV"

};


const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);


const history =
document.getElementById("history");


/*
WAIT FOR USER LOGIN
*/

onAuthStateChanged(auth, async (user) => {

if(!user){

history.innerHTML = `
<div class="empty">
Please sign in to view your transaction history.
</div>
`;

return;

}


try{

/*
FIND TRANSACTIONS FOR THIS USER
*/

const transactionsRef =
collection(db,"transactions");

const q =
query(
transactionsRef,
where("userId","==",user.uid)
);

const snapshot =
await getDocs(q);


if(snapshot.empty){

history.innerHTML = `
<div class="empty">
<div style="font-weight:bold;font-size:18px;">
No transactions yet
</div>

<div style="margin-top:7px;">
Your transactions will appear here.
</div>
</div>
`;

return;

}


/*
CLEAR LOADING MESSAGE
*/

history.innerHTML = "";


/*
CONVERT TRANSACTIONS TO ARRAY
*/

const transactions =
snapshot.docs.map(doc => ({
id:doc.id,
...doc.data()
}));


/*
SORT NEWEST FIRST
*/

transactions.sort((a,b) => {

const dateA =
new Date(a.date || 0);

const dateB =
new Date(b.date || 0);

return dateB - dateA;

});


/*
DISPLAY TRANSACTIONS
*/

transactions.forEach(transaction => {

const div =
document.createElement("div");

div.className =
"transaction";


const status =
transaction.status || "Completed";


const statusClass =
status.toLowerCase();


const amount =
Number(transaction.amount || 0);


const formattedAmount =
"$" + amount.toLocaleString(
"en-US",
{
minimumFractionDigits:2
}
);


const formattedDate =
transaction.date
? new Date(transaction.date).toLocaleString()
: "Date unavailable";


let title = "";

let amountText = "";


if(transaction.type === "Money Received"){

title =
"Money Received";

amountText =
"+" + formattedAmount;

}else{

title =
"Money Sent";

amountText =
"-" + formattedAmount;

}


/*
CREATE TRANSACTION HTML
*/

div.innerHTML = `

<div class="title">
${title}
</div>

<div class="info">
From: ${escapeHTML(transaction.senderName || "Unknown")}
</div>

<div class="info">
To: ${escapeHTML(transaction.receiverName || transaction.userEmail || "Unknown")}
</div>

<div class="amount ${statusClass}">
${amountText}
</div>

<div class="info">
Status:
<span class="${statusClass}">
${escapeHTML(status)}
</span>
</div>

<div class="info">
Transaction ID:
${escapeHTML(transaction.transactionId || transaction.id)}
</div>

<div class="date">
${escapeHTML(formattedDate)}
</div>

`;


history.appendChild(div);

});


}catch(error){

console.error(error);

history.innerHTML = `
<div class="empty">
Unable to load transactions.
<br><br>
${escapeHTML(error.message)}
</div>
`;

}

});


/*
SECURITY:
PREVENT FIRESTORE DATA FROM BEING
INSERTED AS RAW HTML
*/

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
