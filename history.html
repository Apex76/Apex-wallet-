<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction History</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

.header{
    background:#1f4ed8;
    color:white;
    text-align:center;
    padding:20px;
}

.card{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.transaction{
    padding:15px 0;
    border-bottom:1px solid #ddd;
}

.title{
    font-weight:bold;
    font-size:18px;
}

.date{
    color:#777;
    font-size:14px;
}

.amount{
    color:green;
    font-weight:bold;
    margin-top:5px;
}

.btn{
    display:block;
    text-align:center;
    background:#1f4ed8;
    color:white;
    text-decoration:none;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="header">
<h2>Transaction History</h2>
</div>

<div class="card">

<div class="transaction">
<div class="title">No transactions yet</div>
<div class="date">Your transactions will appear here.</div>
</div>

<a href="dashboard.html" class="btn">Back to Dashboard</a>

</div>

</body>
</html>
