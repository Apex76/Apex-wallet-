<!DOCTYPE html>
<html>
<head>
<title>COT Verification</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f7fb;
}

.header{
background:#1f4ed8;
color:white;
padding:20px;
text-align:center;
}

.container{
width:90%;
max-width:450px;
margin:30px auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

input{
width:100%;
padding:15px;
margin-top:15px;
border:1px solid #ccc;
border-radius:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#1f4ed8;
color:white;
border:none;
border-radius:10px;
font-size:17px;
}
</style>

</head>

<body>

<div class="header">
<h2>COT Verification</h2>
</div>

<div class="container">

<p>Please enter your COT Code to complete this transfer.</p>

<input type="password" placeholder="Enter COT Code">

<button onclick="alert('Invalid COT Code. Please contact your account officer.')">
Complete Transfer
</button>

</div>

</body>
</html>
