<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Card</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3ff;
padding:20px;
}

.back{
text-decoration:none;
color:#1f4ed8;
font-size:18px;
}

.card{
margin-top:30px;
background:linear-gradient(135deg,#1f4ed8,#0b1f66);
border-radius:20px;
padding:25px;
color:white;
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.chip{
font-size:40px;
margin-bottom:25px;
}

.number{
font-size:24px;
letter-spacing:3px;
margin-bottom:25px;
}

.row{
display:flex;
justify-content:space-between;
}

.label{
font-size:12px;
opacity:.8;
}

.value{
font-size:16px;
margin-top:5px;
font-weight:bold;
}

button{
margin-top:30px;
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#1f4ed8;
color:white;
font-size:18px;
cursor:pointer;
}

</style>
</head>

<body>

<a href="dashboard2.html" class="back">
<i class="fa-solid fa-arrow-left"></i> Back
</a>

<div class="card">

<div class="chip">
💳
</div>

<div class="number">
**** **** **** 4587
</div>

<div class="row">

<div>
<div class="label">CARD HOLDER</div>
<div class="value" id="holder">
APEX USER
</div>
</div>

<div>
<div class="label">EXPIRES</div>
<div class="value">
12/30
</div>
</div>

<div>
<div class="label">CVV</div>
<div class="value">
***
</div>
</div>

</div>

</div>

<button>
<i class="fa-solid fa-eye"></i> View Card Details
</button>

<script>

const fullname = localStorage.getItem("fullname");

if(fullname){
document.getElementById("holder").innerHTML = fullname.toUpperCase();
}

</script>

</body>
</html>
