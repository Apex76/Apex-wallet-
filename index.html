<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apex Bank - Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#123b78 0%,transparent 40%),
        linear-gradient(135deg,#020b18,#061b35,#082c55);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    color:white;
}

/* MAIN LOGIN BOX */
.container{
    width:100%;
    max-width:390px;
    background:rgba(255,255,255,.97);
    padding:32px 25px;
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

/* LOGO */
.logo-area{
    text-align:center;
    margin-bottom:25px;
}

.logo-mark{
    width:58px;
    height:58px;
    margin:0 auto 12px;
    position:relative;
}

.logo-mark .triangle{
    position:absolute;
    width:0;
    height:0;
    border-left:29px solid transparent;
    border-right:29px solid transparent;
    border-bottom:50px solid #1f5edb;
    left:0;
    top:0;
}

.logo-mark .cut{
    position:absolute;
    width:13px;
    height:30px;
    background:white;
    transform:rotate(30deg);
    left:24px;
    top:13px;
    z-index:2;
}

.logo{
    color:#173d78;
    font-size:25px;
    font-weight:bold;
    letter-spacing:2px;
}

.logo span{
    color:#1f5edb;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-top:6px;
    margin-bottom:27px;
}

/* TITLE */
.welcome{
    text-align:center;
    color:#142d50;
    font-size:25px;
    font-weight:bold;
    margin-bottom:7px;
}

.login-text{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:22px;
}

/* INPUTS */
.input-group{
    position:relative;
    margin-bottom:15px;
}

.input-group i{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:#8a96a8;
    font-size:14px;
}

input{
    width:100%;
    padding:14px 14px 14px 42px;
    border:1px solid #d5dbe5;
    border-radius:9px;
    font-size:15px;
    outline:none;
    background:#fff;
    color:#222;
}

input:focus{
    border-color:#1f5edb;
    box-shadow:0 0 0 3px rgba(31,94,219,.10);
}

.password-eye{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#8a96a8;
    cursor:pointer;
    font-size:14px;
}

/* REMEMBER */
.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:3px 0 20px;
    font-size:12px;
    color:#666;
}

.remember{
    display:flex;
    align-items:center;
    gap:6px;
}

.remember input{
    width:auto;
    padding:0;
}

.forgot{
    color:#1f5edb;
    text-decoration:none;
    font-weight:bold;
}

/* LOGIN BUTTON */
button{
    width:100%;
    padding:14px;
    background:#1f5edb;
    color:white;
    border:none;
    border-radius:9px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 12px rgba(31,94,219,.25);
}

button:hover{
    background:#174db8;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* SIGN UP */
.link{
    text-align:center;
    margin-top:20px;
    color:#666;
    font-size:13px;
}

.link a{
    text-decoration:none;
    color:#1f5edb;
    font-weight:bold;
}

/* DEMO NOTE */
.note{
    text-align:center;
    margin-top:22px;
    color:#999;
    font-size:10px;
    line-height:1.5;
}
</style>

</head>

<body>

<div class="container">

    <div class="logo-area">

        <div class="logo-mark">
            <div class="triangle"></div>
            <div class="cut"></div>
        </div>

        <div class="logo">
            APEX <span>BANK</span>
        </div>

        <div class="subtitle">
            Secure Online Banking
        </div>

    </div>


    <div class="welcome">
        Welcome Back!
    </div>

    <div class="login-text">
        Login to your account
    </div>


    <form id="loginForm">

        <div class="input-group">

            <i>✉</i>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="input-group">

            <i>🔒</i>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <span
                class="password-eye"
                id="passwordEye"
                onclick="togglePassword()"
            >
                👁
            </span>

        </div>


        <div class="options">

            <label class="remember">
                <input type="checkbox">
                Remember me
            </label>

            <a href="#" class="forgot">
                Forgot password?
            </a>

        </div>


        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>


        <div class="link">

            Don't have an account?
            <a href="signup.html">
                Sign up
            </a>

        </div>

    </form>


    <div class="note">
        Note: This is a virtual wallet simulation.
        It has no real-world value.
    </div>

</div>


<script>

function togglePassword(){

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("passwordEye");

    if(password.type === "password"){

        password.type = "text";
        eye.textContent = "🙈";

    }else{

        password.type = "password";
        eye.textContent = "👁";

    }

}

</script>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    setPersistence,
    browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyDqpSzFzHDS-zI1gR6oP-wXWQKBfXgcX4w",

    authDomain:
    "apex-wallet-2.firebaseapp.com",

    projectId:
    "apex-wallet-2",

    storageBucket:
    "apex-wallet-2.firebasestorage.app",

    messagingSenderId:
    "660772557652",

    appId:
    "1:660772557652:web:b9535515388134f8802ec1",

    measurementId:
    "G-KEJP4GN5VV"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");


loginForm.addEventListener(
    "submit",
    async (e) => {

        e.preventDefault();


        const email =
            document.getElementById("email")
            .value
            .trim();


        const password =
            document.getElementById("password")
            .value;


        loginButton.disabled = true;

        loginButton.textContent =
            "Signing In...";


        try{

            await setPersistence(
                auth,
                browserLocalPersistence
            );


            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            localStorage.setItem(
                "loggedIn",
                "true"
            );


            localStorage.setItem(
                "fullname",
                userCredential.user.displayName ||
                "User"
            );


            localStorage.setItem(
                "userEmail",
                userCredential.user.email ||
                ""
            );


            window.location.replace(
                "dashboard2.html"
            );


        }catch(error){

            console.error(error);

            alert(error.message);

            loginButton.disabled = false;

            loginButton.textContent =
                "Login";

        }

    }
);

</script>

</body>
</html>
