<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX BANK Dashboard</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3ff;
padding-bottom:90px;
}

.header{
background:#1f4ed8;
color:white;
padding:25px;
border-radius:0 0 30px 30px;
}

.top{
display:flex;
align-items:center;
}

.profile{
width:70px;
height:70px;
border-radius:50%;
border:3px solid white;
object-fit:cover;
margin-right:15px;
background:white;
}

.welcome{
font-size:15px;
opacity:.9;
}

.name{
font-size:24px;
font-weight:bold;
margin-top:4px;
}

.account{
margin-top:25px;
background:rgba(255,255,255,.15);
padding:18px;
border-radius:15px;
}

.account small{
opacity:.8;
font-size:14px;
}

.balance{
font-size:40px;
font-weight:bold;
margin-top:8px;
}

.view{
margin-top:10px;
font-size:15px;
opacity:.9;
}

.quick{
display:flex;
justify-content:space-around;
margin:25px 15px;
}

.quick a{
text-decoration:none;
color:#222;
text-align:center;
}

.circle{
width:70px;
height:70px;
border-radius:50%;
background:white;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
color:#1f4ed8;
box-shadow:0 4px 12px rgba(0,0,0,.15);
margin:auto;
margin-bottom:8px;
}

.card{
background:white;
margin:15px;
padding:18px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card h3{
margin-bottom:15px;
color:#1f4ed8;
}

.action{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid #eee;
text-decoration:none;
color:#222;
font-size:18px;
}

.action:last-child{
border-bottom:none;
}

.bottom{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:14px 0;
box-shadow:0 -3px 15px rgba(0,0,0,.15);
}

.bottom a{
text-decoration:none;
color:#666;
text-align:center;
font-size:13px;
}

.bottom i{
display:block;
font-size:22px;
margin-bottom:5px;
}

.active{
color:#1f4ed8!important;
font-weight:bold;
}

</style>
</head>

<body>

<script>
if(!localStorage.getItem("loggedIn")){
location.href="index.html";
}
</script>

<div class="header">

<div class="top">

<img id="profilePic"
class="profile"
src="https://i.imgur.com/4Z7bKQp.png">

<div>

<div class="welcome">
Welcome
</div>

<div id="welcomeName" class="name">
User
</div>

</div>

</div>

<div class="account">

<small>APEX CHECKING ACCOUNT</small>

<div class="balance">
$0.00
</div>

<div class="view">
<i class="fa-solid fa-eye"></i>
View Balance Details
</div>

</div>

</div>

<div class="quick">

<a href="#">
<div class="circle">
<i class="fa-solid fa-building-columns"></i>
</div>
My Account
</a
  <div class="card">

<h3>Quick Services</h3>

<a href="history.html" class="action">
<span><i class="fa-solid fa-clock-rotate-left"></i> Transaction History</span>
<i class="fa-solid fa-chevron-right"></i>
</a>

<a href="transfer.html" class="action">
<span><i class="fa-solid fa-money-bill-transfer"></i> Transfer Money</span>
<i class="fa-solid fa-chevron-right"></i>
</a>

<a href="settings.html" class="action">
<span><i class="fa-solid fa-gear"></i> Settings</span>
<i class="fa-solid fa-chevron-right"></i>
</a>

</div>

<div class="card">

<h3>Recent Activity</h3>

<p style="color:#777;text-align:center;padding:20px;">
No recent transactions.
</p>

</div>

<div class="bottom">

<a href="dashboard2.html" class="active">
<i class="fa-solid fa-house"></i>
Home
</a>

<a href="transfer.html">
<i class="fa-solid fa-paper-plane"></i>
Transfer
</a>

<a href="history.html">
<i class="fa-solid fa-file-lines"></i>
History
</a>

<a href="settings.html">
<i class="fa-solid fa-gear"></i>
Settings
</a>

</div>

<script>

const fullname = localStorage.getItem("fullname");

if(fullname){
document.getElementById("welcomeName").innerHTML = fullname;
}

const profileImage = localStorage.getItem("profileImage");

if(profileImage){
document.getElementById("profilePic").src = profileImage;
}

</script>

</body>
</html>
