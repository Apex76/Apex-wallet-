<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef3ff;
padding-bottom:90px;
}

.header{
background:#1f4ed8;
color:white;
padding:25px;
border-radius:0 0 30px 30px;
}

.top{
display:flex;
align-items:center;
}

.profile{
width:70px;
height:70px;
border-radius:50%;
border:3px solid white;
object-fit:cover;
margin-right:15px;
background:white;
}

.welcome{
font-size:15px;
opacity:.9;
}

.name{
font-size:24px;
font-weight:bold;
margin-top:4px;
}

.account{
margin-top:25px;
background:rgba(255,255,255,.15);
padding:18px;
border-radius:15px;
}

.account small{
opacity:.8;
font-size:14px;
}

.balance{
font-size:40px;
font-weight:bold;

.view{
margin-top:10px;
font-size:15px;
opacity:.9;
cursor:pointer;

/* =========================
   VIRTUAL CARD
========================= */

.virtual-card{
margin:20px 15px;
height:205px;
border-radius:22px;
padding:22px;
color:white;
background:linear-gradient(135deg,#111827,#1f4ed8);
box-shadow:0 8px 20px rgba(0,0,0,.25);
position:relative;
overflow:hidden;
}

.virtual-card::before{
content:"";
position:absolute;
width:220px;
height:220px;
border-radius:50%;
background:rgba(255,255,255,.08);
right:-80px;
top:-90px;
}

.virtual-card::after{
content:"";
position:absolute;
width:180px;
height:180px;
border-radius:50%;
background:rgba(255,255,255,.05);
left:-80px;
bottom:-100px;
}

.card-top{
display:flex;
justify-content:space-between;
align-items:center;
position:relative;
z-index:2;
}

.card-brand{
font-size:19px;
font-weight:bold;
letter-spacing:1px;
}

.virtual-label{
font-size:11px;
padding:6px 9px;
border:1px solid rgba(255,255,255,.5);
border-radius:20px;
}

.chip{
width:45px;
height:32px;
background:#d6d6d6;
border-radius:7px;
margin-top:25px;
position:relative;
z-index:2;
}

.chip::after{
content:"";
position:absolute;
left:20px;
top:0;
width:2px;
height:32px;
background:#999;
}

.chip::before{
content:"";
position:absolute;
left:0;
top:15px;
width:45px;
height:2px;
background:#999;
}

.card-number{
font-size:22px;
letter-spacing:3px;
margin-top:15px;
position:relative;
z-index:2;
font-weight:bold;
}

.card-bottom{
display:flex;
justify-content:space-between;
align-items:flex-end;
margin-top:13px;
position:relative;
z-index:2;
}

.card-holder-label{
font-size:9px;
opacity:.7;
margin-bottom:4px;
}

.card-holder{
font-size:15px;
font-weight:bold;
text-transform:uppercase;
max-width:220px;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.card-type{
font-size:17px;
font-weight:bold;
font-style:italic;
}

.quick{
display:flex;
justify-content:space-around;
margin:25px 15px;
}

.quick a{
text-decoration:none;
color:#222;
text-align:center;
}

.circle{
width:70px;
height:70px;
border-radius:50%;
background:white;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
color:#1f4ed8;
box-shadow:0 4px 12px rgba(0,0,0,.15);
margin:auto;
margin-bottom:8px;
}

.card{
background:white;
margin:15px;
padding:18px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card h3{
margin-bottom:15px;
color:#1f4ed8;
}

.action{
display:flex;
justify-content:space-between;
padding:15px 0;
border-bottom:1px solid #eee;
text-decoration:none;
color:#222;
font-size:18px;
}

.action:last-child{
border-bottom:none;
}

.bottom{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:14px 0;
box-shadow:0 -3px 15px rgba(0,0,0,.15);
}

.bottom a{
text-decoration:none;
color:#666;
text-align:center;
font-size:13px;
}

.bottom i{
display:block;
font-size:22px;
margin-bottom:5px;
}

.active{
color:#1f4ed8!important;
font-weight:bold;
}

</style>

<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
doc,
getDoc,
collection,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

apiKey: "AIzaSyDqpSzFzHDS-zI1gR6oP-wXWqKBfXgcX4w",

authDomain: "apex-wallet-2.firebaseapp.com",

projectId: "apex-wallet-2",

storageBucket: "apex-wallet-2.firebasestorage.app",

messagingSenderId: "660772557652",

appId: "1:660772557652:web:b9535515388134f8802ec1",

measurementId: "G-KEJP4GN5VV"

};


/* =========================
   INITIALIZE
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(auth, async (user) => {

if(!user){

window.location.replace("index.html");

return;

}


/* =========================
   SAVE LOGIN INFO
========================= */

localStorage.setItem(
"loggedIn",
"true"
);

localStorage.setItem(
"userEmail",
user.email || ""
);


/* =========================
   USER NAME
========================= */

const userName =

user.displayName ||

localStorage.getItem("fullname") ||

localStorage.getItem("fullName") ||

localStorage.getItem("name") ||

"User";


document.getElementById(
"welcomeName"
).textContent = userName;


document.getElementById(
"cardHolderName"
).textContent = userName;


/* =========================
   LOAD USER BALANCE
========================= */

try{

let userData = null;


/*
First try the Firebase Auth UID
as the Firestore document ID.
*/

const userRef =
doc(db,"users",user.uid);

const userSnap =
await getDoc(userRef);


if(userSnap.exists()){

userData = userSnap.data();

}


/*
If the UID document isn't found,
try finding the user by email.
*/

if(!userData && user.email){

const usersRef =
collection(db,"users");

const emailQuery =
query(
usersRef,
where("email","==",user.email)
);

const emailSnap =
await getDocs(emailQuery);


if(!emailSnap.empty){

userData =
emailSnap.docs[0].data();

}

}


/* =========================
   DISPLAY BALANCE
========================= */

if(userData){

const userBalance =
Number(userData.balance || 0);

document.getElementById(
"balance"
).textContent =
userBalance.toFixed(2);

document.getElementById(
"balance"
).dataset.realBalance =
userBalance.toFixed(2);

}else{

document.getElementById(
"balance"
).textContent =
"0.00";

document.getElementById(
"balance"
).dataset.realBalance =
"0.00";

}


}catch(error){

console.error(
"Balance loading error:",
error
);

}

});

</script>


<!-- =========================
     BALANCE SHOW / HIDE
========================= -->

<script>

let balanceVisible = true;


function toggleBalance(){

const balance =
document.getElementById("balance");

const eyeIcon =
document.getElementById("eyeIcon");


if(balanceVisible){

balance.dataset.realBalance =
balance.textContent;

balance.textContent =
"****";

eyeIcon.className =
"fa-solid fa-eye-slash";

balanceVisible = false;

}else{

balance.textContent =
balance.dataset.realBalance || "0.00";

eyeIcon.className =
"fa-solid fa-eye";

balanceVisible = true;

}

}

</script>
